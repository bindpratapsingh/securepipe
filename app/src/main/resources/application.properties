# Base configuration for the VRSMS backend.
#
# No real credentials live here. Every value uses a ${ENV_VAR:default}
# placeholder, so:
#   - the defaults are enough to start the app against a local PostgreSQL
#   - the Helm chart overrides them with environment variables at deploy time
#   - the Spring context always starts, because every placeholder resolves
#
# The last point matters more than it looks: AuthService and StaffController
# read the Twilio values with @Value and no default, so a missing property
# used to fail the whole context at startup.

spring.application.name=vrsms-server

# --- Datasource -------------------------------------------------------------
# Overridden in Kubernetes by SPRING_DATASOURCE_URL and friends, which the
# chart's ConfigMap and Secret supply.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vrsms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vrsms}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vrsms}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate --------------------------------------------------------
# "none" by default so the app never rewrites a database it does not own. The
# chart sets this to "update" for the throwaway demo database, which starts
# empty and needs its schema generated.
#
# PostgreSQL is not interchangeable here: the entities map their enums with
# @JdbcTypeCode(SqlTypes.NAMED_ENUM), which generates native
# "CREATE TYPE ... AS ENUM" DDL that H2 cannot produce.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Actuator ---------------------------------------------------------------
# Only health and info are exposed; the rest stay off.
# probes.enabled splits health into /actuator/health/liveness and
# /actuator/health/readiness, which the Helm chart uses as separate probes.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# --- Twilio Verify ----------------------------------------------------------
# Placeholder values. The OTP endpoints will not work with them, which is
# correct: real credentials belong in the environment, never in the repository.
twilio.account-sid=${TWILIO_ACCOUNT_SID:ACdummy00000000000000000000000000}
twilio.auth-token=${TWILIO_AUTH_TOKEN:dummy-auth-token}
twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:VAdummy00000000000000000000000000}
