apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vrsms.fullname" . }}
  labels:
    {{- include "vrsms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vrsms.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vrsms.selectorLabels" . | nindent 8 }}
      annotations:
        # Hashing the rendered config into the pod template means a change to
        # the ConfigMap or Secret rolls the pods. Without these annotations,
        # helm upgrade updates the ConfigMap and the running pods keep serving
        # with the stale values until something else restarts them.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- if .Values.postgres.enabled }}
      # Hibernate runs DDL at startup, so the app cannot boot until the
      # database accepts connections. Without this gate the first pod
      # crash-loops until PostgreSQL happens to become ready.
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "vrsms.postgres.fullname" . }} -p 5432 -U {{ .Values.postgres.username }}; do
                echo "waiting for postgres..."
                sleep 2
              done
              echo "postgres is ready"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      {{- end }}

      containers:
        - name: vrsms-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "vrsms.fullname" . }}
            - secretRef:
                name: {{ include "vrsms.fullname" . }}
          # A cold JVM takes a while to serve traffic. Readiness gets a large
          # failureThreshold rather than a long initialDelaySeconds, so the pod
          # joins the Service as soon as it is genuinely up instead of always
          # waiting out a fixed delay.
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
