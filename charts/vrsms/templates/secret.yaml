{{/*
Credentials the application reads as environment variables.

These are plain values from values.yaml, which is fine for a throwaway demo
cluster but is NOT how secrets should reach a real cluster - a Secret manifest
only base64-encodes, it does not encrypt. See the README on known shortcuts.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vrsms.fullname" . }}
  labels:
    {{- include "vrsms.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.postgres.password | quote }}
  TWILIO_AUTH_TOKEN: {{ .Values.twilio.authToken | quote }}
